# Kindle Linux boot hook (installed by "Kindle Linux: boot ON", removed by "boot OFF").
# Runs after the stock UI starts; the script itself decides whether to switch to Kindle Linux.
start on started lab126_gui

task

script
    [ -f /mnt/us/kos/kos-boot.sh ] || exit 0
    exec /bin/sh /mnt/us/kos/kos-boot.sh
end script
