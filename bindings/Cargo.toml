[package]
name = "engine-ffi"
description = "The engine's API for apps on other platforms: generates Kotlin (Android) and Swift (iOS, macOS) bindings with UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "engine_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
engine = { path = "../engine" }
uniffi = "0.32"
